# Nome e porta da aplicação.
spring.application.name=prioriza
server.port=8080
server.forward-headers-strategy=framework

# Banco H2 em arquivo: não perde os dados quando o servidor reinicia.
# Usa novo nome para não conflitar com o banco da versão antiga do ZIP.
spring.datasource.url=jdbc:h2:file:./dados/calendario;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

# Datas mostradas conforme o fuso do Brasil (Manaus).
spring.jackson.time-zone=America/Manaus
